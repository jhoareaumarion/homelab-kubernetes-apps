apiVersion: v1
kind: ConfigMap
metadata:
  name: datasources
  namespace: grafana
  labels:
    grafana_datasource: "1"
data:
  sources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.prometheus.svc.cluster.local:9090
        isDefault: true
        editable: true
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.grafana-loki.svc.cluster.local:3100
        isDefault: false
        editable: true