apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
data:
  config.yaml: |
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      disable_env_credential_login: true
      enable_jwt_auth: true
      require_master_key: true
      litellm_jwtauth:
        user_roles_jwt_field: "roles"
        user_allowed_roles:
          - proxy_admin
          - internal_user
        admin_jwt_scope: "proxy_admin"
        enforce_rbac: true
    role_permissions:
      - role: proxy_admin
        models:
          - ornith-1.5-9b
      - role: internal_user
        models:
          - ornith-1.5-9b

    environment_variables:
      JWT_PUBLIC_KEY_URL: "https://auth.hoareau-marion.eu/realms/milkyway/protocol/openid-connect/certs"
      PROXY_BASE_URL: "https://litellm.hoareau-marion.eu"
      AUTO_REDIRECT_UI_LOGIN_TO_SSO: "true"
      NO_DOCS: "True"
      NO_REDOC: "True"
      NO_OPENAPI: "True"

    model_list:
      - model_name: ornith-1.5-9b      
        model_info:
          max_input_tokens: 20000
          max_output_tokens: 4096
          max_tokens: 24096
          supports_function_calling: true
          supports_parallel_function_calling: false            
        litellm_params:
          model: ollama_chat/ornith-1.5-9b
          api_base: "http://ollama.hoareau-marion.eu:11434"
          truncate_large_inputs: true
          num_ctx: 16000      
          num_predict: 4096
          temperature: 0.2
          system_prompt: "You are a coding assistant. Ensure all shell commands executed via tool calls have perfectly matched and escaped quotes. Never append duplicate quotes at the end of echo statements."
      - model_name: nomic-embed-text
        litellm_params:
          model: ollama/nomic-embed-text
          api_base: "http://ollama.hoareau-marion.eu:11434"