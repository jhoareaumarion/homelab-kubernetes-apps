apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
data:
  config.yaml: |
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      disable_env_credential_login: true
      enable_jwt_auth: true
      require_master_key: true
      litellm_jwtauth:
        user_roles_jwt_field: "roles"
        user_allowed_roles:
          - proxy_admin
          - internal_user
        admin_jwt_scope: "proxy_admin"
        enforce_rbac: true
    role_permissions:
      - role: proxy_admin
        models:
          - qwen2.5-coder-7b
      - role: internal_user
        models:
          - qwen2.5-coder-7b

    environment_variables:
      JWT_PUBLIC_KEY_URL: "https://auth.hoareau-marion.eu/realms/milkyway/protocol/openid-connect/certs"
      PROXY_BASE_URL: "https://litellm.hoareau-marion.eu"
      AUTO_REDIRECT_UI_LOGIN_TO_SSO: "true"
      NO_DOCS: "True"
      NO_REDOC: "True"
      NO_OPENAPI: "True"

    model_list:
      - model_name: qwen2.5-coder-7b
        litellm_params:
          model: ollama/qwen2.5-coder:7b
          api_base: "http://qwen-2.5-7b.hoareau-marion.eu:11434"