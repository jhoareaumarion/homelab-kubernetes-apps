apiVersion: apps/v1
kind: Deployment
metadata:
  name: moonlight-web
  labels:
    app: moonlight
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moonlight
  template:
    metadata:
      labels:
        app: moonlight
        gateway-access: moonlight
    spec:
      nodeSelector:
        affected_vlan: "50"
      containers:
      - name: moonlight
        image: mrcreativ3001/moonlight-web-stream:v3.0.0@sha256:0332bb694138eb4939c001b6319055d35745b6c5c0d5fa44421e7077c3990ee0
        envFrom:
        - configMapRef:
            name: config-map
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: config-volume
          mountPath: /app/server/config.json
          subPath: config.json
        - name: moonlight-nfs-storage
          mountPath: /app/server
      volumes:
      - name: config-volume
        configMap:
          name: config-map 
      - name: moonlight-nfs-storage
        persistentVolumeClaim:
          claimName: pvc