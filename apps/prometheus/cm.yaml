apiVersion: v1
kind: ConfigMap
metadata:
  name: config-map
  namespace: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Scrape Node Exporter
      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ['prometheus-exporters']
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: node-exporter-svc

      # Scrape PVE Exporter
      - job_name: 'pve-exporter'
        metrics_path: /pve
        params:
          cluster: ['1']
          node: ['1']
        static_configs:
          - targets:
              - mars.private.hoareau-marion.eu
              - mercury.private.hoareau-marion.eu
              - jupiter.private.hoareau-marion.eu
        relabel_configs:
          # 1. Pass the full hostname into the ?target= parameter
          - source_labels: [__address__]
            target_label: __param_target

          # 2. Dynamically extract the node prefix (mars, mercury, jupiter) 
          # and map it to the ?module= parameter
          - source_labels: [__address__]
            regex: '^([a-z]+)\..*'
            target_label: __param_module
            replacement: '$1'

          # 3. Clean up the Grafana/Prometheus 'instance' label to show the node hostname
          - source_labels: [__param_target]
            target_label: instance

          # 4. Redirect the actual network scrape away from the target 
          # and into your K3S ClusterIP service
          - target_label: __address__
            replacement: 'pve-exporter.prometheus-exporters.svc.cluster.local:9221'

      # Scrape Kube State Metrics
      - job_name: 'kube-state-metrics'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ['kube-state-metrics']
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: kube-state-metrics