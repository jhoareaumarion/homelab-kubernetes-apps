apiVersion: v1
kind: Service
metadata:
  name: truenas-graphite-exporter-svc
  namespace: prometheus-exporters
  labels:
    app: truenas-graphite-exporter
spec:
  type: ClusterIP
  selector:
    app: truenas-graphite-exporter
  ports:
    - name: graphite-in
      port: 9109
      targetPort: 9109
    - name: metrics
      port: 9108
      targetPort: 9108