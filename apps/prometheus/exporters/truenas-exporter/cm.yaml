apiVersion: v1
kind: ConfigMap
metadata:
  name: truenas-graphite-exporter-config
  namespace: prometheus-exporters
data:
  graphite_mapping.conf: |
    mappings:
      # --- CPU ---
      - match: "*.cpu.*.*"
        name: "truenas_cpu_total"
        labels:
          hostname: "$1"
          cpu: "$2"
          mode: "$3"

      # --- MEMOIRE ---
      - match: "*.memory.*"
        name: "truenas_memory_bytes"
        labels:
          hostname: "$1"
          type: "$2"

      # --- DISQUES / IO ---
      - match: "*.disk-*.disk_octets.*"
        name: "truenas_disk_io_bytes_total"
        labels:
          hostname: "$1"
          device: "$2"
          direction: "$3"

      - match: "*.disk-*.disk_ops.*"
        name: "truenas_disk_ops_total"
        labels:
          hostname: "$1"
          device: "$2"
          operation: "$3"

      # --- RESEAU ---
      - match: "*.interface-*.if_octets.*"
        name: "truenas_interface_bytes_total"
        labels:
          hostname: "$1"
          device: "$2"
          direction: "$3"

      - match: "*.interface-*.if_errors.*"
        name: "truenas_interface_errors_total"
        labels:
          hostname: "$1"
          device: "$2"
          direction: "$3"

      # --- ZFS / ARC CACHE ---
      - match: "*.zfs_arc.*"
        name: "truenas_zfs_arc_$2"
        labels:
          hostname: "$1"

      - match: "*.zfs_arc-*.*"
        name: "truenas_zfs_arc_$2_$3"
        labels:
          hostname: "$1"

      # --- RÈGLE PAR DÉFAUT (Fallback) ---
      # Capture toutes les métriques non explicites pour éviter de perdre de la donnée
      - match: "*.*.*"
        name: "truenas_$2_$3"
        labels:
          hostname: "$1"