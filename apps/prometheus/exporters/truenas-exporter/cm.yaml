apiVersion: v1
kind: ConfigMap
metadata:
  name: truenas-graphite-exporter-config
  namespace: prometheus-exporters
data:
  graphite_mapping.conf: |
    mappings:
      # --- CPU (6 segments : scale.truenas.<host>.cpu.<id>.<mode>) ---
      - match: "*.truenas.*.cpu.*.*"
        name: "truenas_cpu_total"
        labels:
          prefix: "$1"
          hostname: "$2"
          cpu: "$4"
          mode: "$5"

      # --- MEMOIRE (5 segments : scale.truenas.<host>.memory.<type>) ---
      - match: "*.truenas.*.memory.*"
        name: "truenas_memory_bytes"
        labels:
          prefix: "$1"
          hostname: "$2"
          type: "$4"

      # --- ZFS ARC (5 segments : scale.truenas.<host>.zfs_arc.<stat>) ---
      - match: "*.truenas.*.zfs_arc.*"
        name: "truenas_zfs_arc_$4"
        labels:
          prefix: "$1"
          hostname: "$2"

      # --- FALLBACKS ADAPTÉS AU PRÉFIXE ---
      - match: "*.*.*.*"
        name: "truenas_$3_$4"
        labels:
          prefix: "$1"
          hostname: "$2"

      - match: "*.*.*.*.*"
        name: "truenas_$3_$4_$5"
        labels:
          prefix: "$1"
          hostname: "$2"

      - match: "*.*.*.*.*.*"
        name: "truenas_$3_$4_$5_$6"
        labels:
          prefix: "$1"
          hostname: "$2"