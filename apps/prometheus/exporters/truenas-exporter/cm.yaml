apiVersion: v1
kind: ConfigMap
metadata:
  name: truenas-graphite-exporter-config
  namespace: prometheus-exporters
data:
  graphite_mapping.conf: |
    mappings:
      # ==========================================
      # 1. CPU (Correspond exactement au Dashboard 19661)
      # Format Graphite : scale.truenas.<host>.cpu.<device>.<mode>
      # Transforme en : truenas_aggregation_cpu_gauge_<mode>
      # ==========================================
      - match: "scale.truenas.*.cpu.*.*"
        name: "truenas_aggregation_cpu_gauge_$3"
        labels:
          hostname: "$1"
          device: "$2"

      # ==========================================
      # 2. MEMORY 
      # Format Graphite : scale.truenas.<host>.memory.<type>
      # Transforme en : truenas_aggregation_memory_gauge_<type>
      # ==========================================
      - match: "scale.truenas.*.memory.*"
        name: "truenas_aggregation_memory_gauge_$2"
        labels:
          hostname: "$1"

      # ==========================================
      # 3. ZFS ARC 
      # Format Graphite : scale.truenas.<host>.zfs_arc.<stat>
      # ==========================================
      - match: "scale.truenas.*.zfs_arc.*"
        name: "truenas_zfs_arc_$2"
        labels:
          hostname: "$1"

      # ==========================================
      # 4. DISKS (I/O, Stats)
      # ==========================================
      - match: "scale.truenas.*.disk.*.*.*"
        name: "truenas_disk_$2_$3_$4"
        labels:
          hostname: "$1"

      - match: "scale.truenas.*.disk.*.*"
        name: "truenas_disk_$2_$3"
        labels:
          hostname: "$1"

      # ==========================================
      # 5. NETWORK 
      # ==========================================
      - match: "scale.truenas.*.net.*.*.*"
        name: "truenas_net_$2_$3_$4"
        labels:
          hostname: "$1"

      - match: "scale.truenas.*.net.*.*"
        name: "truenas_net_$2_$3"
        labels:
          hostname: "$1"