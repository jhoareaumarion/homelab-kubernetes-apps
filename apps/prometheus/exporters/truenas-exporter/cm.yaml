apiVersion: v1
kind: ConfigMap
metadata:
  name: truenas-graphite-exporter-config
  namespace: prometheus-exporters
data:
  graphite_mapping.conf: |
    mappings:
      # --- CPU (5 segments : truenas.<host>.cpu.<id>.<mode>) ---
      - match: "truenas.*.cpu.*.*"
        name: "truenas_cpu_total"
        labels:
          hostname: "$1"
          cpu: "$2"
          mode: "$3"

      # --- MEMOIRE (4 segments : truenas.<host>.memory.<type>) ---
      - match: "truenas.*.memory.*"
        name: "truenas_memory_bytes"
        labels:
          hostname: "$1"
          type: "$2"

      # --- ZFS ARC (4 segments : truenas.<host>.zfs_arc.<stat>) ---
      - match: "truenas.*.zfs_arc.*"
        name: "truenas_zfs_arc_$2"
        labels:
          hostname: "$1"

      # --- FALLBACKS PAR NOMBRE DE SEGMENTS ---
      # Remplace avantageusement les règles disk/net spécifiques sans faire planter l'exporter
      - match: "truenas.*.*.*"
        name: "truenas_$2_$3"
        labels:
          hostname: "$1"

      - match: "truenas.*.*.*.*"
        name: "truenas_$2_$3_$4"
        labels:
          hostname: "$1"

      - match: "truenas.*.*.*.*.*"
        name: "truenas_$2_$3_$4_$5"
        labels:
          hostname: "$1"