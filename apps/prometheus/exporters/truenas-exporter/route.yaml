apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: truenas-graphite-exporter-tcp-route
  namespace: prometheus-exporters
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ingress-gateway
      namespace: cluster-gateway 
      sectionName: graphite-in
  rules:
    - backendRefs:
        - name: truenas-graphite-exporter-svc
          port: 9109