apiVersion: apps/v1
kind: Deployment
metadata:
  name: pve-exporter
  namespace: prometheus-exporters
  labels:
    app: pve-exporter
    gateway-access: prometheus-exporters
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pve-exporter
  template:
    metadata:
      labels:
        app: pve-exporter
    spec:
      initContainers:
        - name: build-config
          image: busybox@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          envFrom:
            - secretRef:
                name: tokens
          command:
            - /bin/sh
            - -c
            - |
              cat <<EOF > /etc/pve/pve.yml
              mars:
                user: "$USER"
                token_name: "$TOKEN_ID"
                token_value: "$MARS_TOKEN"
                port: 443

              mercury:
                user: "$USER"
                token_name: "$TOKEN_ID"
                token_value: "$MERCURY_TOKEN"
                port: 443

              jupiter:
                user: "$USER"
                token_name: "$TOKEN_ID"
                token_value: "$JUPITER_TOKEN"
                port: 443
              EOF
          volumeMounts:
            - name: config-volume
              mountPath: /etc/pve
      containers:
        - name: pve-exporter
          image: prompve/prometheus-pve-exporter:3.9.0
          args:
            - "--config.file=/etc/pve/pve.yml"
          volumeMounts:
            - name: config-volume
              mountPath: /etc/pve
      volumes:
        - name: config-volume
          emptyDir: {}