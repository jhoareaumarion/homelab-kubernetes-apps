apiVersion: apps/v1
kind: Deployment
metadata:
  name: sroom-prt01-scanner
  namespace: sroom-prt01-scanner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sroom-prt01-scanner
  template:
    metadata:
      labels:
        app: sroom-prt01-scanner 
    spec:
      nodeSelector:
        affected_vlan: "60"
      hostNetwork: true
      containers:
        - name: sroom-prt01-scanner
          image: ghcr.io/philippmundhenk/brotherscannerdocker:v2.1.0@sha256:15aa1bbeafcc2abaabe0a96d783ce0993337dc8d0081149ae6f1d8a65c2803c4
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: cm
            - secretRef:
                name: secrets
          ports:
            - containerPort: 33555
            - containerPort: 54925
              protocol: UDP
              name: scanner-udp
            - containerPort: 54921
              protocol: TCP
              name: scanner-tcp
            - containerPort: 161
              protocol: UDP
              name: snmp-udp
          volumeMounts:
            - name: ftp-script-override
              mountPath: /opt/brother/scanner/brscan-skey/script/sendtoftps.sh
              subPath: sendtoftps.sh
      volumes:
        - name: ftp-script-override
          configMap:
            name: sendtoftps-sh
            defaultMode: 0755