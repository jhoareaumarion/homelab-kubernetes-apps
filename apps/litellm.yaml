# apps/litellm.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: argocd
  labels:
    hoareau-marion.eu/category: ai
spec:
  project: homelab
  sources:
    - repoURL: https://github.com/jhoareaumarion/homelab-kubernetes-apps
      targetRevision: HEAD
      path: apps/litellm  
      directory:  
        recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: litellm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
