apiVersion: apps/v1
kind: Deployment
metadata:
  name: mas-postgres
  namespace: synapse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mas-postgres
  template:
    metadata:
      labels:
        app: mas-postgres
    spec:
      nodeSelector:
        affected_vlan: "50"
      containers:
        - name: postgres
          image: docker.io/library/postgres:18@sha256:b9f6b8ff03b62f3cfd9d9ba3fe56226a9991c79d3fb46fd46536263bf02be553
          envFrom:
            - configMapRef:
                name: mas-db-cm 
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mas-secrets
                  key: MAS_POSTGRES_PASSWORD
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql
              subPath: pgdata
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: mas-db-pvc