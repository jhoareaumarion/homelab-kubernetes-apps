apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-auth-service
  namespace: synapse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matrix-auth-service
  template:
    metadata:
      labels:
        app: matrix-auth-service
    spec:
      containers:
      - name: mas
        image: ghcr.io/element-hq/matrix-authentication-service:1.27.0@sha256:085e37263957b3b79be85de9cfda1980b97e9653f284fba0c902445e06c200b8
        ports:
        - containerPort: 8080
          name: http
        args: 
          - "server"
        env:
        - name: MAS_CONFIG
          value: /etc/mas/config.yaml
        volumeMounts:
        - name: config
          mountPath: /etc/mas/config.yaml
          subPath: config.yaml
      volumes:
      - name: config
        secret:
          secretName: mas-secrets