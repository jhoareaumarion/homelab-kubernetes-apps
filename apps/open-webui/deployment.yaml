apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      nodeSelector:
        affected_vlan: "50"
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.12.0@sha256:1565038903151ced924b5a3226f73f40f16963df4b910441f6391f10144afdaa
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: open-webui-config
            - secretRef:
                name: open-webui-secrets
          volumeMounts:
            - name: open-webui-data
              mountPath: /app/backend/data
          resources:
            limits:
              cpu: "1000m"
              memory: 1Gi
            requests:
              cpu: "100m"
              memory: 256Mi
      volumes:
        - name: open-webui-data
          persistentVolumeClaim:
            claimName: open-webui-pvc