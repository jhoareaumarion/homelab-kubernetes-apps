apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-worker-plan
  namespace: system-upgrade
spec:
  concurrency: 1 
  cordon: true
  nodeSelector:
    matchExpressions:
      - key: kubernetes.io/hostname
        operator: In
        values:
          - home-desk-r04-mer01-50-wkub-01
          - home-desk-r04-mer01-50-wkub-02
          - home-desk-r04-mer01-60-wkub-01
  serviceAccountName: system-upgrade
  prepare:
    image: rancher/k3s-upgrade
  upgrade:
    image: rancher/k3s-upgrade
    version: v1.34.4+k3s1